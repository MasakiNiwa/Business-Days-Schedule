# GitHub Pages への公開（docs/SPEC.md §11.3）。
#
# main の公開と週次の祝日更新を同じ経路で検査・公開する。
# データは公開成果物に含める。保護された main へのボット push は行わない。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 毎週月曜 03:17 JST。混雑しやすい正時を避ける。
    - cron: '17 18 * * 0'

permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイは中断せず、キューの後続のみ入れ替える。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 認証なしの api.github.com は IP あたり60回/時で、共用ランナーでは
      # すぐ 403 になる。実際にそれで公開が止まったので、トークンを渡す。
      #
      # 取れなかったときの扱いは、実行のきっかけで変える。
      #   push / 手動 … 代替データで公開を続ける（目的はコードの公開）
      #   週次        … 何も公開しない（目的は祝日の更新そのもの）
      # 代替は「リポジトリの版」と「いま公開中の版」の新しいほうを使う
      # （docs/SPEC.md §3.4）。
      - name: 最新の祝日データを取得
        id: holidays
        # --published-url は、取得に失敗したときに「いま公開中の版」を読み戻す先。
        # リポジトリの版だけに落とすと、週次で更新したぶんを巻き戻してしまう。
        run: >-
          npm run holidays --
          ${{ github.event_name == 'schedule' && '--require-fresh' || '' }}
          --published-url https://masakiniwa.github.io/Business-Days-Schedule/data/holidays.json
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # 壊れたものを公開しないよう、デプロイ前にも型チェックとテストを通す。
      - name: 型チェック
        run: npm run typecheck

      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build

      - name: E2E 用ブラウザの用意
        run: npm run e2e:install

      - name: 公開成果物をブラウザで検査
        run: npm run e2e

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
