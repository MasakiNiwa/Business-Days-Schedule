# GitHub Pages への公開（docs/SPEC.md §11.3）。
#
# main の公開と週次の祝日更新を同じ経路で検査・公開する。
# データは公開成果物に含める。保護された main へのボット push は行わない。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 毎週月曜 03:17 JST。混雑しやすい正時を避ける。
    - cron: '17 18 * * 0'

permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイは中断せず、キューの後続のみ入れ替える。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 最新の祝日データを取得（失敗時は前回の公開を維持）
        run: npm run holidays

      # 壊れたものを公開しないよう、デプロイ前にも型チェックとテストを通す。
      - name: 型チェック
        run: npm run typecheck

      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build

      - name: E2E 用ブラウザの用意
        run: npm run e2e:install

      - name: 公開成果物をブラウザで検査
        run: npm run e2e

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
