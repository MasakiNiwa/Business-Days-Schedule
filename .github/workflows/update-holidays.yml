# 祝日データの自動更新（docs/SPEC.md §3.4）。
#
#   一次ソース: holiday-jp/holiday_jp の holidays.yml
#   二次検証  : 内閣府 CSV（取得できない場合もあるため continue-on-error）
#
# 差分があるときだけコミットする。取得に失敗した場合はワークフローを失敗させ、
# 既存の public/data/holidays.json は保持する。
name: Update holidays

on:
  schedule:
    # 毎週月曜 03:00 JST（日曜 18:00 UTC）
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-holidays
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 祝日データを取得して生成
        run: npm run holidays

      # 終了コードで結果を分ける。
      #   0 = 一致 / 1 = 不一致（公開しない） / 2 = 確認できず（既存データは維持）
      - name: 内閣府 CSV と突合（二次検証）
        id: verify
        run: |
          set +e
          npm run holidays:verify
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "result=match" >> "$GITHUB_OUTPUT" ;;
            1) echo "result=mismatch" >> "$GITHUB_OUTPUT" ;;
            *) echo "result=unverifiable" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: 検証結果を meta に反映
        env:
          VERIFIED: ${{ steps.verify.outputs.result }}
        run: |
          node --input-type=module -e '
            import { readFile, writeFile } from "node:fs/promises";
            const path = "public/data/holidays.json";
            const data = JSON.parse(await readFile(path, "utf-8"));
            const result = process.env.VERIFIED;
            data.meta.verifiedAgainstCao = result === "match" ? true : result === "mismatch" ? false : null;
            await writeFile(path, JSON.stringify(data, null, 2) + "\n");
          '

      - name: テスト（生成物が既存ロジックを壊していないか）
        run: npm test

      # 実データが内閣府と食い違うときは公開しない。誤った営業日を配るほうが害が大きい。
      - name: 差分があればコミット
        id: commit
        if: steps.verify.outputs.result != 'mismatch'
        run: |
          if git diff --quiet -- public/data/holidays.json; then
            echo "変更はありません"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/holidays.json
          git commit -m "chore(data): 祝日データを更新"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 不一致なら公開を止めたことを明示
        if: steps.verify.outputs.result == 'mismatch'
        run: |
          echo "::error::内閣府 CSV と不一致のため、祝日データを公開しませんでした。"

      - name: 突合できなかった／不一致なら Issue を起票
        if: steps.verify.outputs.result != 'match'
        uses: actions/github-script@v7
        env:
          VERIFY_RESULT: ${{ steps.verify.outputs.result }}
        with:
          script: |
            const label = 'holiday-data-mismatch';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `再度、内閣府 CSV との突合に失敗しました。\n\n実行ログ: ${runUrl}`,
              });
              return;
            }

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'd93f0b',
                description: '祝日データが内閣府 CSV と一致しない',
              });
            } catch (error) {
              if (error.status !== 422) throw error; // 既に存在する場合は無視
            }

            const mismatch = process.env.VERIFY_RESULT === 'mismatch';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: mismatch
                ? '祝日データが内閣府 CSV と一致しません（公開を停止しました）'
                : '祝日データを内閣府 CSV と突合できませんでした',
              labels: [label],
              body: (mismatch
                ? [
                    '一次ソース (holiday-jp/holiday_jp) と内閣府 CSV に**実データの差異**がありました。',
                    '**祝日データの公開は行っていません。**',
                    '',
                    '次のいずれかが考えられます。',
                    '',
                    '- 内閣府が祝日を追加・変更し、一次ソースがまだ追随していない',
                    '- 内閣府 CSV の形式が変わり、解釈を誤っている',
                  ]
                : [
                    '内閣府 CSV を取得・解釈できず、突合できませんでした。',
                    '既存の祝日データはそのまま維持しています（未検証の扱い）。',
                    '',
                    '一時的な通信の失敗であれば、次回の実行で解消します。',
                  ]
              )
                .concat(['', `実行ログ: ${runUrl}`])
                .join('\n'),
            });
