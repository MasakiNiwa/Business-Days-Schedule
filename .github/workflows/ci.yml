name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 版は .nvmrc の1か所で決める（最新の安定版 Node.js 26）。
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build

      # 単体テストでは拾えない「編集 → 再読込 → 再追加」のような、
      # 保存と画面をまたぐ流れを本番ビルドに対して確かめる。
      - name: E2E 用ブラウザの用意
        run: npm run e2e:install

      - name: E2E
        run: npm run e2e

      # 更新案内の検査だけは dist を作り直しながら確かめるので、
      # 並行して走る側とは分けて最後に単独で走らせる。
      - name: E2E（更新案内）
        run: npm run e2e:update

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
